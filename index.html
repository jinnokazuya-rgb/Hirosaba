<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ヒロサバ 事務所メンバー管理</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1f2937;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}header{position:sticky;top:0;z-index:3;background:#fff;border-bottom:1px solid #e5e7eb;padding:14px 16px}.head{max-width:980px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px}h1{font-size:18px;margin:0}.date{font-size:13px;color:#64748b}.wrap{max-width:980px;margin:auto;padding:14px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.sum{background:white;border:1px solid #e5e7eb;border-radius:14px;padding:12px}.sum b{display:block;font-size:22px}.sum span{font-size:12px;color:#64748b}.toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}button{border:0;border-radius:10px;padding:9px 12px;font-weight:650;cursor:pointer}.primary{background:#2563eb;color:white}.ghost{background:white;border:1px solid #dbe1ea;color:#334155}.danger{color:#b91c1c}.cards{display:grid;gap:10px}.card{background:#fff;border:1px solid #e3e8ef;border-radius:16px;padding:13px;box-shadow:0 1px 2px #00000008}.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.name{font-size:17px;font-weight:750}.joined{font-size:12px;color:#64748b;margin-top:3px}.fixed,.daily{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}.label{font-size:11px;color:#64748b;margin-bottom:5px}.toggle,.choice{width:100%;min-height:39px;background:#f1f5f9;color:#475569}.toggle.on{background:#dcfce7;color:#166534}.choice.manual{background:#dbeafe;color:#1d4ed8}.choice.skip{background:#fef3c7;color:#92400e}.choice.none{background:#fee2e2;color:#991b1b}.counter{display:flex;align-items:center;gap:7px}.counter button{min-width:40px;padding:9px;background:#eef2f7;color:#334155}.count{flex:1;text-align:center;font-weight:800;padding:9px 6px;border-radius:10px;background:#fee2e2;color:#991b1b}.count.done{background:#dcfce7;color:#166534}.battlegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.hint{font-size:10px;color:#94a3b8;margin-top:4px}.sectionline{height:1px;background:#eef2f7;margin:12px 0 3px}.daily-title{font-size:12px;font-weight:700;color:#475569}.modal{display:none;position:fixed;inset:0;background:#0006;z-index:10;align-items:flex-end;justify-content:center}.modal.show{display:flex}.sheet{width:min(100%,560px);background:#fff;border-radius:20px 20px 0 0;padding:18px}.sheet h2{font-size:18px;margin:0 0 14px}.field{margin:10px 0}.field label{display:block;font-size:12px;color:#64748b;margin-bottom:5px}.field input{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:10px}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}.empty{text-align:center;color:#64748b;padding:40px 12px;background:white;border-radius:16px}.note{font-size:11px;color:#94a3b8;margin-top:12px;text-align:center}.tabs{display:flex;gap:6px;margin-bottom:12px;background:#e9eef5;padding:5px;border-radius:13px}.tab{flex:1;background:transparent;color:#64748b}.tab.active{background:#fff;color:#1e40af;box-shadow:0 1px 3px #0001}.panel{display:none}.panel.active{display:block}.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.weektitle{font-weight:800;text-align:center}.tablewrap{overflow:auto;background:#fff;border:1px solid #e3e8ef;border-radius:14px}.weektable{border-collapse:collapse;min-width:850px;width:100%;font-size:12px}.weektable th,.weektable td{border-bottom:1px solid #edf0f4;border-right:1px solid #edf0f4;padding:8px;text-align:center;vertical-align:middle}.weektable th{background:#f8fafc;position:sticky;top:0;z-index:1}.weektable th:first-child,.weektable td:first-child{position:sticky;left:0;background:#fff;text-align:left;z-index:2;min-width:120px}.weektable th:first-child{background:#f8fafc;z-index:3}.cellgood{background:#ecfdf5}.cellwarn{background:#fff7ed}.cellbad{background:#fef2f2}.cellna{background:#f8fafc;color:#94a3b8}.tiny{display:block;font-size:10px;color:#64748b;margin-top:2px}.weekdone{font-weight:800;color:#166534}.weekpending{font-weight:800;color:#92400e}@media(min-width:700px){.cards{grid-template-columns:1fr 1fr}.modal{align-items:center}.sheet{border-radius:20px}.summary{max-width:560px}}
.backupmsg{font-size:11px;color:#64748b;align-self:center}.fileinput{display:none}</style><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#2563eb"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="ヒロサバ管理"><link rel="apple-touch-icon" href="icon-192.png"></head><body><header><div class="head"><div><h1>事務所メンバー管理</h1><div class="date" id="today"></div></div><button class="primary" onclick="openAdd()">＋ メンバー</button></div></header><main class="wrap"><div class="tabs"><button class="tab active" id="tabToday" onclick="showTab('todayPanel')">今日のチェック</button><button class="tab" id="tabWeek" onclick="showTab('weekPanel')">週間一覧</button></div><section class="panel active" id="todayPanel"><section class="summary"><div class="sum"><b id="members">0</b><span>在籍</span></div><div class="sum"><b id="battle">0/0</b><span>対抗戦確認</span></div><div class="sum"><b id="gift">0/0</b><span>差し入れ確認</span></div></section><div class="toolbar"><button class="ghost" onclick="resetToday()">今日のチェックをリセット</button><button class="ghost" onclick="exportBackup()">バックアップ保存</button><button class="ghost" onclick="document.getElementById('backupFile').click()">バックアップ復元</button><input class="fileinput" id="backupFile" type="file" accept="application/json,.json"><button class="ghost" onclick="addDemo()">サンプルを追加</button></div><section class="cards" id="cards"></section></section><section class="panel" id="weekPanel"><div class="weeknav"><button class="ghost" onclick="moveWeek(-1)">‹ 前週</button><div class="weektitle" id="weekTitle"></div><button class="ghost" onclick="moveWeek(1)">翌週 ›</button></div><div class="tablewrap" id="weekTable"></div></section><div class="note">試作版：データはこの端末のブラウザ内に保存されます。</div></main>
<div class="modal" id="modal"><div class="sheet"><h2 id="modalTitle">メンバー追加</h2><div class="field"><label>名前</label><input id="name" placeholder="例：Quake"></div><div class="field"><label>加入日</label><input id="join" type="date"></div><div class="actions"><button class="ghost danger" id="deleteBtn" style="display:none;margin-right:auto" onclick="deleteMember()">メンバー削除</button><button class="ghost" onclick="closeModal()">キャンセル</button><button class="primary" onclick="saveMember()">保存</button></div></div></div>
<script>
const KEY='hirosaba-office-proto-v2'; const OLD='hirosaba-office-proto-v1';
function gameNow(){let n=new Date();let g=new Date(n);g.setHours(g.getHours()-5);return g}
function dkey(){let g=gameNow();return `${g.getFullYear()}-${String(g.getMonth()+1).padStart(2,'0')}-${String(g.getDate()).padStart(2,'0')}`}
function wkey(){let g=gameNow(), day=(g.getDay()+6)%7;g.setDate(g.getDate()-day);return `${g.getFullYear()}-${String(g.getMonth()+1).padStart(2,'0')}-${String(g.getDate()).padStart(2,'0')}`}
let data=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem(OLD)||'[]'); let editing=null; let weekOffset=0;
function persist(){localStorage.setItem(KEY,JSON.stringify(data));render()} function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function todayRec(m){m.days=m.days||{};let old=m.days[dkey()]||{};let manual=old.dailyManual??(old.battle==='manual'?3:0),skip=old.dailySkip??0;manual=Math.max(0,Math.min(3,manual));skip=Math.max(0,Math.min(3-manual,skip));m.days[dkey()]={dailyManual:manual,dailySkip:skip,gift:!!old.gift};return m.days[dkey()]}
function weekRec(m){m.weeks=m.weeks||{};m.weeks[wkey()]=m.weeks[wkey()]||{weekly:0};return m.weeks[wkey()]}
function showTab(id){document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id===id));document.getElementById('tabToday').classList.toggle('active',id==='todayPanel');document.getElementById('tabWeek').classList.toggle('active',id==='weekPanel');if(id==='weekPanel')renderWeek()}
function gameDateObj(key){let [y,m,d]=key.split('-').map(Number);return new Date(y,m-1,d)}
function mondayForOffset(off){let g=gameNow(),day=(g.getDay()+6)%7;g.setHours(0,0,0,0);g.setDate(g.getDate()-day+off*7);return g}
function fmtKey(dt){return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`}
function weekMondayForDate(dt){let x=new Date(dt);x.setHours(0,0,0,0);let day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);return x}
function battleEligibleForWeek(m,mon){if(!m.join)return true;let join=gameDateObj(m.join),joinMon=weekMondayForDate(join);return joinMon<mon || (joinMon.getTime()===mon.getTime() && join.getDay()===1)}
function giftEligibleOn(m,dt){if(!m.join)return true;let join=gameDateObj(m.join),day=new Date(dt);join.setHours(0,0,0,0);day.setHours(0,0,0,0);return day>join}
function giftEligibleToday(m){return giftEligibleOn(m,gameDateObj(dkey()))}
function moveWeek(n){weekOffset+=n;renderWeek()}
function renderWeek(){let mon=mondayForOffset(weekOffset),sun=new Date(mon);sun.setDate(mon.getDate()+6);document.getElementById('weekTitle').textContent=`${mon.getMonth()+1}/${mon.getDate()} ～ ${sun.getMonth()+1}/${sun.getDate()}`;let days=[...Array(7)].map((_,j)=>{let x=new Date(mon);x.setDate(mon.getDate()+j);return x});let labels=['月','火','水','木','金','土','日'];let wk=fmtKey(mon);let rows=data.map(m=>{let eligible=battleEligibleForWeek(m,mon);let cells=days.map((dt,j)=>{let key=fmtKey(dt),join=m.join?gameDateObj(m.join):null;if(join&&dt<join)return `<td class="cellna">—</td>`;let r=(m.days||{})[key],giftOK=giftEligibleOn(m,dt),gf=!!(r&&r.gift);if(!eligible)return `<td class="${giftOK&&gf?'cellwarn':'cellna'}"><b>対 —</b><span class="tiny">差 ${giftOK?(gf?'✓':'未'):'—'}</span></td>`;if(!r){let cls=giftOK?'cellbad':'cellwarn';return `<td class="${cls}"><b>対 0/3</b><span class="tiny">差 ${giftOK?'未':'—'}</span></td>`}let dm=Math.max(0,Math.min(3,r.dailyManual??(r.battle==='manual'?3:0))),ds=Math.max(0,Math.min(3-dm,r.dailySkip??0)),total=dm+ds,cls=total>=3&&(!giftOK||gf)?'cellgood':(total>0||gf||!giftOK?'cellwarn':'cellbad');return `<td class="${cls}"><b>対 ${total}/3</b><span class="tiny">手 ${dm}・ス ${ds}</span><span class="tiny">差 ${giftOK?(gf?'✓':'未'):'—'}</span></td>`}).join('');let wr=((m.weeks||{})[wk]||{}).weekly||0;let weekCell=eligible?`<td class="${wr>=7?'cellgood':'cellwarn'}"><span class="${wr>=7?'weekdone':'weekpending'}">${wr}/7${wr>=7?' ✓':''}</span></td>`:`<td class="cellna"><b>—</b></td>`;return `<tr><td><b>${esc(m.name)}</b><span class="tiny">${m.join||'加入日未設定'}</span></td>${cells}${weekCell}</tr>`}).join('');document.getElementById('weekTable').innerHTML=`<table class="weektable"><thead><tr><th>メンバー</th>${labels.map((x,j)=>`<th>${x}<span class="tiny">${days[j].getMonth()+1}/${days[j].getDate()}</span></th>`).join('')}<th>週7回</th></tr></thead><tbody>${rows||'<tr><td colspan="9">メンバーがいません</td></tr>'}</tbody></table>`}
function render(){let now=new Date(),g=gameNow();document.getElementById('today').textContent=`${new Intl.DateTimeFormat('ja-JP',{dateStyle:'full'}).format(now)} ｜ ゲーム内更新 5:00`;document.getElementById('members').textContent=data.length;let bc=0,gc=0,gEligible=0;data.forEach(m=>{let r=todayRec(m);if((r.dailyManual+r.dailySkip)>=3)bc++;if(giftEligibleToday(m)){gEligible++;if(r.gift)gc++}});document.getElementById('battle').textContent=`${bc}/${data.length}`;document.getElementById('gift').textContent=`${gc}/${gEligible}`;document.getElementById('cards').innerHTML=data.length?data.map((m,i)=>{let r=todayRec(m),w=weekRec(m),eligible=battleEligibleForWeek(m,mondayForOffset(0)),giftOK=giftEligibleToday(m);return `<article class="card"><div class="top"><div><div class="name">${esc(m.name)}</div><div class="joined">加入日：${m.join||'未設定'}</div></div><button class="ghost" onclick="editMember(${i})">編集</button></div><div class="fixed"><div><div class="label">加入後の挨拶</div><button class="toggle ${m.greet?'on':''}" onclick="toggle(${i},'greet')">${m.greet?'✓ 済':'未確認'}</button></div><div><div class="label">運営ルール確認</div><button class="toggle ${m.rules?'on':''}" onclick="toggle(${i},'rules')">${m.rules?'✓ 確認済':'未確認'}</button></div></div><div class="sectionline"></div><div class="daily-title">対抗戦</div><div class="battlegrid"><div><div class="label">デイリー参加（合計3回まで）</div>${eligible?`<div class="counter"><button onclick="changeDailyType(${i},'manual',-1)">−</button><div class="count ${r.dailyManual+r.dailySkip>=3?'done':''}">手動 ${r.dailyManual}</div><button onclick="changeDailyType(${i},'manual',1)">＋</button></div><div class="counter" style="margin-top:6px"><button onclick="changeDailyType(${i},'skip',-1)">−</button><div class="count ${r.dailyManual+r.dailySkip>=3?'done':''}">スキップ ${r.dailySkip}</div><button onclick="changeDailyType(${i},'skip',1)">＋</button></div><div class="hint">合計 ${r.dailyManual+r.dailySkip}/3 ｜ 毎日 AM5:00 切り替え</div>`:`<div class="count" style="background:#f1f5f9;color:#94a3b8">—</div>`}</div><div><div class="label">ウィークリー参加</div>${eligible?`<div class="counter"><button onclick="changeWeekly(${i},-1)">−</button><div class="count ${w.weekly>=7?'done':''}">${w.weekly}/7</div><button onclick="changeWeekly(${i},1)">＋</button></div>`:`<div class="count" style="background:#f1f5f9;color:#94a3b8">—</div>`}<div class="hint">毎週月曜 AM5:00 切り替え</div></div></div><div class="daily"><div><div class="label">差し入れ</div>${giftOK?`<button class="toggle ${r.gift?'on':''}" onclick="toggleGift(${i})">${r.gift?'✓ 済':'未確認'}</button>`:`<div class="count" style="background:#f1f5f9;color:#94a3b8">—</div>`}<div class="hint">毎日 AM5:00 切り替え</div></div></div></article>`}).join(''):'<div class="empty">まだメンバーがいません。<br>「＋ メンバー」から追加してください。</div>';localStorage.setItem(KEY,JSON.stringify(data));if(document.getElementById('weekPanel').classList.contains('active'))renderWeek()}
function toggle(i,k){data[i][k]=!data[i][k];persist()} function toggleGift(i){let r=todayRec(data[i]);r.gift=!r.gift;persist()}
function changeDailyType(i,type,n){let r=todayRec(data[i]);let key=type==='skip'?'dailySkip':'dailyManual';if(n>0){if(r.dailyManual+r.dailySkip>=3)return;r[key]++}else r[key]=Math.max(0,r[key]-1);persist()} function changeWeekly(i,n){let r=weekRec(data[i]);r.weekly=Math.max(0,Math.min(7,r.weekly+n));persist()}
let deleteArmed=false;
function resetDeleteButton(){deleteArmed=false;const b=document.getElementById('deleteBtn');b.textContent='メンバー削除';b.style.background='white';b.style.color='#b91c1c'}
function openAdd(){editing=null;resetDeleteButton();document.getElementById('modalTitle').textContent='メンバー追加';document.getElementById('name').value='';document.getElementById('join').value=new Date().toLocaleDateString('sv-SE');document.getElementById('deleteBtn').style.display='none';document.getElementById('modal').classList.add('show')} function editMember(i){editing=i;resetDeleteButton();document.getElementById('modalTitle').textContent='メンバー編集';document.getElementById('name').value=data[i].name;document.getElementById('join').value=data[i].join||'';document.getElementById('deleteBtn').style.display='inline-block';document.getElementById('modal').classList.add('show')} function closeModal(){resetDeleteButton();document.getElementById('modal').classList.remove('show')}
function deleteMember(){if(editing===null||!data[editing])return;const b=document.getElementById('deleteBtn');if(!deleteArmed){deleteArmed=true;b.textContent='もう一度押して削除';b.style.background='#fee2e2';b.style.color='#991b1b';return}data.splice(editing,1);editing=null;deleteArmed=false;document.getElementById('modal').classList.remove('show');persist()}
function saveMember(){const nameInput=document.getElementById('name'),joinInput=document.getElementById('join');const memberName=nameInput.value.trim();if(!memberName)return alert('名前を入力してください');if(editing===null)data.push({name:memberName,join:joinInput.value,greet:false,rules:false,days:{},weeks:{}});else{data[editing].name=memberName;data[editing].join=joinInput.value}closeModal();persist()}
function resetToday(){if(!confirm('現在のゲーム内デイリー（手動・スキップ・差し入れ）を未確認に戻しますか？'))return;data.forEach(m=>m.days[dkey()]={dailyManual:0,dailySkip:0,gift:false});persist()}
function addDemo(){if(data.length&&!confirm('サンプルメンバーを追加しますか？'))return;data.push({name:'Quake',join:'2026-10-01',greet:true,rules:true,days:{},weeks:{}},{name:'frosty',join:'2026-10-03',greet:true,rules:true,days:{},weeks:{}});todayRec(data[data.length-2]).dailyManual=3;todayRec(data[data.length-2]).gift=true;weekRec(data[data.length-2]).weekly=5;todayRec(data[data.length-1]).dailyManual=2;weekRec(data[data.length-1]).weekly=7;persist()}
document.getElementById('modal').addEventListener('click',e=>{if(e.target===document.getElementById('modal'))closeModal()});render();

function exportBackup(){
 const payload={app:'hirosaba-office-manager',version:1,exportedAt:new Date().toISOString(),data};
 const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
 const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`hirosaba-backup-${dkey()}.json`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function importBackupFile(file){
 if(!file)return; const reader=new FileReader(); reader.onload=()=>{try{const obj=JSON.parse(reader.result); const next=Array.isArray(obj)?obj:obj.data; if(!Array.isArray(next))throw new Error(); if(!confirm('現在のデータをバックアップ内容で置き換えますか？'))return; data=next; persist(); alert('バックアップを復元しました');}catch(e){alert('このバックアップファイルを読み込めませんでした');}}; reader.readAsText(file);
}
document.getElementById('backupFile').addEventListener('change',e=>{importBackupFile(e.target.files[0]);e.target.value=''});
if('serviceWorker' in navigator && location.protocol.startsWith('http')) window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
