</style><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#2563eb"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="ヒロサバ管理"><link rel="apple-touch-icon" href="icon-192.png"></head><body><header><div class="head"><div><h1>事務所メンバー管理</h1><div class="date" id="today"></div></div><button class="primary" onclick="openAdd()">＋ メンバー</button></div></header><main class="wrap"><div class="tabs"><button class="tab active" id="tabToday" onclick="showTab('todayPanel')">今日のチェック</button><button class="tab" id="tabWeek" onclick="showTab('weekPanel')">週間一覧</button><button class="tab" id="tabHistory" onclick="showTab('historyPanel')">履歴</button></div><section class="panel active" id="todayPanel"><section class="summary"><div class="sum"><b id="members">0</b><span>在籍</span></div><div class="sum"><b id="battle">0/0</b><span>対抗戦確認</span></div><div class="sum"><b id="gift">0/0</b><span>差し入れ確認</span></div></section><div class="toolbar"><button class="ghost" onclick="resetToday()">今日のチェックをリセット</button><button class="ghost" onclick="openBulk()">まとめて登録</button><button class="ghost" onclick="exportBackup()">バックアップ保存</button><button class="ghost" onclick="document.getElementById('backupFile').click()">バックアップ復元</button><input class="fileinput" id="backupFile" type="file" accept="application/json,.json"><button class="ghost" onclick="addDemo()">サンプルを追加</button></div><section class="cards" id="cards"></section></section><section class="panel" id="weekPanel"><div class="weeknav"><button class="ghost" onclick="moveWeek(-1)">‹ 前週</button><div class="weektitle" id="weekTitle"></div><button class="ghost" onclick="moveWeek(1)">翌週 ›</button></div><div class="tablewrap" id="weekTable"></div></section><section class="panel" id="historyPanel"><div class="historycontrols"><button class="ghost" onclick="moveHistoryWeek(-1)">‹ 前週</button><button class="ghost" onclick="historyWeekOffset=0;renderHistory()">今週</button><button class="ghost" onclick="moveHistoryWeek(1)">翌週 ›</button><b id="historyTitle"></b><button class="ghost" onclick="exportHistoryCSV(false)">この週をCSV</button><button class="ghost" onclick="exportHistoryCSV(true)">全履歴をCSV</button></div><div class="historylegend"><span><i class="dot hgood"></i>完了</span><span><i class="dot hwarn"></i>一部</span><span><i class="dot hbad"></i>未完了</span><span><i class="dot hna"></i>対象外</span><span>セルをタップすると詳細</span></div><div class="historysummary"><div class="sum"><b id="histComplete">0</b><span>完了セル</span></div><div class="sum"><b id="histPartial">0</b><span>一部セル</span></div><div class="sum"><b id="histMissing">0</b><span>未完了セル</span></div></div><div class="tablewrap" id="historyTable"></div><div class="csvnote" style="margin-top:8px">CSVはExcel・Googleスプレッドシート等で開けます。バックアップJSONとは別に、閲覧・集計用として出力します。</div></section><div class="note">試作版：データはこの端末のブラウザ内に保存されます。</div></main>
<div class="bulk" id="bulkModal"><div class="bulkbox"><h2 style="margin:0 0 6px">今日の状態をまとめて登録</h2><div style="font-size:12px;color:#64748b;margin-bottom:10px">旧版を見ながら入力してください。空欄の行は登録されません。既存データがある場合は追加登録になります。</div><div class="bulkrow bulkhead"><div>名前</div><div>加入日</div><div>挨拶</div><div>ルール</div><div>手動</div><div>スキップ</div><div>差し入れ / 週</div></div><div id="bulkRows"></div><div class="bulkactions"><button class="ghost" onclick="closeBulk()">キャンセル</button><button class="primary" onclick="saveBulk()">まとめて登録</button></div></div></div><div class="modal" id="modal"><div class="sheet"><h2 id="modalTitle">メンバー追加</h2><div class="field"><label>名前</label><input id="name" placeholder="例：Quake"></div><div class="field"><label>加入日</label><input id="join" type="date"></div><div class="actions"><button class="ghost danger" id="deleteBtn" style="display:none;margin-right:auto" onclick="deleteMember()">メンバー削除</button><button class="ghost" onclick="closeModal()">キャンセル</button><button class="primary" onclick="saveMember()">保存</button></div></div></div>
<div class="modal" id="historyModal"><div class="sheet"><h2 id="historyModalTitle">履歴詳細</h2><div id="historyDetail" class="detailbox memberhistory"></div><div class="actions"><button class="ghost" onclick="closeHistoryDetail()">閉じる</button></div></div></div>
<script>
const KEY='hirosaba-office-proto-v2'; const OLD='hirosaba-office-proto-v1';
function gameNow(){let n=new Date();let g=new Date(n);g.setHours(g.getHours()-5);return g}
function dkey(){let g=gameNow();return `${g.getFullYear()}-${String(g.getMonth()+1).padStart(2,'0')}-${String(g.getDate()).padStart(2,'0')}`}
function wkey(){let g=gameNow(), day=(g.getDay()+6)%7;g.setDate(g.getDate()-day);return `${g.getFullYear()}-${String(g.getMonth()+1).padStart(2,'0')}-${String(g.getDate()).padStart(2,'0')}`}
let data=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem(OLD)||'[]'); let editing=null; let weekOffset=0;
function persist(){localStorage.setItem(KEY,JSON.stringify(data));render()} function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function todayRec(m){m.days=m.days||{};let old=m.days[dkey()]||{};let manual=old.dailyManual??(old.battle==='manual'?3:0),skip=old.dailySkip??0;manual=Math.max(0,Math.min(3,manual));skip=Math.max(0,Math.min(3-manual,skip));m.days[dkey()]={dailyManual:manual,dailySkip:skip,gift:!!old.gift,dailyManualTimes:Array.isArray(old.dailyManualTimes)?old.dailyManualTimes:[],dailySkipTimes:Array.isArray(old.dailySkipTimes)?old.dailySkipTimes:[],giftTime:old.giftTime||''};return m.days[dkey()]}
function weekRec(m){m.weeks=m.weeks||{};m.weeks[wkey()]=m.weeks[wkey()]||{weekly:0};let r=m.weeks[wkey()];if(!Array.isArray(r.weeklyDates))r.weeklyDates=[];return r}
function showTab(id){document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id===id));document.getElementById('tabToday').classList.toggle('active',id==='todayPanel');document.getElementById('tabWeek').classList.toggle('active',id==='weekPanel');document.getElementById('tabHistory').classList.toggle('active',id==='historyPanel');if(id==='weekPanel')renderWeek();if(id==='historyPanel')renderHistory()}
function gameDateObj(key){let [y,m,d]=key.split('-').map(Number);return new Date(y,m-1,d)}
function mondayForOffset(off){let g=gameNow(),day=(g.getDay()+6)%7;g.setHours(0,0,0,0);g.setDate(g.getDate()-day+off*7);return g}
function fmtKey(dt){return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`}
function weekMondayForDate(dt){let x=new Date(dt);x.setHours(0,0,0,0);let day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);return x}
function battleEligibleForWeek(m,mon){if(!m.join)return true;let join=gameDateObj(m.join),joinMon=weekMondayForDate(join);return joinMon<mon || (joinMon.getTime()===mon.getTime() && join.getDay()===1)}
function giftEligibleOn(m,dt){if(!m.join)return true;let join=gameDateObj(m.join),day=new Date(dt);join.setHours(0,0,0,0);day.setHours(0,0,0,0);return day>join}
function giftEligibleToday(m){return giftEligibleOn(m,gameDateObj(dkey()))}
function moveWeek(n){weekOffset+=n;renderWeek()}
function renderWeek(){let mon=mondayForOffset(weekOffset),sun=new Date(mon);sun.setDate(mon.getDate()+6);document.getElementById('weekTitle').textContent=`${mon.getMonth()+1}/${mon.getDate()} ～ ${sun.getMonth()+1}/${sun.getDate()}`;let days=[...Array(7)].map((_,j)=>{let x=new Date(mon);x.setDate(mon.getDate()+j);return x});let labels=['月','火','水','木','金','土','日'];let wk=fmtKey(mon);let rows=data.map(m=>{let eligible=battleEligibleForWeek(m,mon);let cells=days.map((dt,j)=>{let key=fmtKey(dt),join=m.join?gameDateObj(m.join):null;if(join&&dt<join)return `<td class="cellna">—</td>`;let r=(m.days||{})[key],giftOK=giftEligibleOn(m,dt),gf=!!(r&&r.gift);if(!eligible)return `<td class="${giftOK&&gf?'cellwarn':'cellna'}"><b>対 —</b><span class="tiny">差 ${giftOK?(gf?'✓'+(r&&r.giftTime?' '+r.giftTime:''):'未'):'—'}</span></td>`;if(!r){let cls=giftOK?'cellbad':'cellwarn';return `<td class="${cls}"><b>対 0/3</b><span class="tiny">差 ${giftOK?'未':'—'}</span></td>`}let dm=Math.max(0,Math.min(3,r.dailyManual??(r.battle==='manual'?3:0))),ds=Math.max(0,Math.min(3-dm,r.dailySkip??0)),total=dm+ds,cls=total>=3&&(!giftOK||gf)?'cellgood':(total>0||gf||!giftOK?'cellwarn':'cellbad');return `<td class="${cls}"><b>対 ${total}/3</b><span class="tiny">手 ${dm}・ス ${ds}</span><span class="tiny">差 ${giftOK?(gf?'✓'+(r&&r.giftTime?' '+r.giftTime:''):'未'):'—'}</span></td>`}).join('');let wr=((m.weeks||{})[wk]||{}).weekly||0;let weekCell=eligible?`<td class="${wr>=7?'cellgood':'cellwarn'}"><span class="${wr>=7?'weekdone':'weekpending'}">${wr}/7${wr>=7?' ✓':''}</span></td>`:`<td class="cellna"><b>—</b></td>`;return `<tr><td><b>${esc(m.name)}</b><span class="tiny">${m.join||'加入日未設定'}</span></td>${cells}${weekCell}</tr>`}).join('');document.getElementById('weekTable').innerHTML=`<table class="weektable"><thead><tr><th>メンバー</th>${labels.map((x,j)=>`<th>${x}<span class="tiny">${days[j].getMonth()+1}/${days[j].getDate()}</span></th>`).join('')}<th>週7回</th></tr></thead><tbody>${rows||'<tr><td colspan="9">メンバーがいません</td></tr>'}</tbody></table>`}
function hourOptions(selected){return Array.from({length:24},(_,j)=>{let h=(j+5)%24,k=String(h).padStart(2,'0')+':00',label=k+'～'+String((h+1)%24).padStart(2,'0')+':59';return `<option value="${k}" ${selected===k?'selected':''}>${label}</option>`}).join('')}
function currentHourKey(){return String(new Date().getHours()).padStart(2,'0')+':00'}
function timeSummary(r,type){let arr=type==='skip'?r.dailySkipTimes:r.dailyManualTimes,count=type==='skip'?r.dailySkip:r.dailyManual;if(!count)return '—';let known=arr.slice(0,count);let missing=Math.max(0,count-known.length);return known.concat(missing?Array(missing).fill('時刻未記録'):[]).join(' / ')}
function weeklyDateSummary(w){if(!w.weekly)return '—';let a=(w.weeklyDates||[]).slice(0,w.weekly),missing=Math.max(0,w.weekly-a.length);return a.concat(missing?Array(missing).fill('日時未記録'):[]).join('・')}
let historyWeekOffset=0;
function moveHistoryWeek(n){historyWeekOffset+=n;renderHistory()}
function recForDay(m,key){let r=(m.days||{})[key];if(!r)return null;let dm=Math.max(0,Math.min(3,r.dailyManual??(r.battle==='manual'?3:0))),ds=Math.max(0,Math.min(3-dm,r.dailySkip??0));return {...r,dailyManual:dm,dailySkip:ds}}
function weekRecForKey(m,key){let r=(m.weeks||{})[key];if(!r)return {weekly:0,weeklyDates:[]};return {weekly:Number(r.weekly)||0,weeklyDates:Array.isArray(r.weeklyDates)?r.weeklyDates:[]}}
function dayStatus(m,dt){let join=m.join?gameDateObj(m.join):null;if(join&&dt<join)return 'na';let mon=weekMondayForDate(dt);if(!battleEligibleForWeek(m,mon))return 'na';let key=fmtKey(dt),r=recForDay(m,key),giftOK=giftEligibleOn(m,dt);if(!r)return 'bad';let total=r.dailyManual+r.dailySkip,giftDone=!giftOK||!!r.gift;if(total>=3&&giftDone)return 'good';if(total>0||r.gift||!giftOK)return 'warn';return 'bad'}
function renderHistory(){let mon=mondayForOffset(historyWeekOffset),sun=new Date(mon);sun.setDate(mon.getDate()+6);document.getElementById('historyTitle').textContent=`${mon.getMonth()+1}/${mon.getDate()} ～ ${sun.getMonth()+1}/${sun.getDate()}`;let days=[...Array(7)].map((_,j)=>{let x=new Date(mon);x.setDate(mon.getDate()+j);return x}),labels=['月','火','水','木','金','土','日'],good=0,warn=0,bad=0;let rows=data.map((m,i)=>{let cells=days.map((dt,j)=>{let st=dayStatus(m,dt),key=fmtKey(dt),r=recForDay(m,key),txt=st==='na'?'—':st==='good'?'●':st==='warn'?'△':'×';if(st==='good')good++;else if(st==='warn')warn++;else if(st==='bad')bad++;let sub=r?`${r.dailyManual+r.dailySkip}/3${giftEligibleOn(m,dt)?(r.gift?'・差✓':'・差×'):''}`:'';return `<td class="hcell h${st}" onclick="openHistoryDetail(${i},'${key}')"><b>${txt}</b><span class="tiny">${sub}</span></td>`}).join('');return `<tr><td><button class="memberlink" onclick="openMemberHistory(${i})"><b>${esc(m.name)}</b></button><span class="tiny">個人履歴を見る</span></td>${cells}</tr>`}).join('');document.getElementById('histComplete').textContent=good;document.getElementById('histPartial').textContent=warn;document.getElementById('histMissing').textContent=bad;document.getElementById('historyTable').innerHTML=`<table class="weektable historytable"><thead><tr><th>メンバー</th>${days.map((d,j)=>`<th>${labels[j]}<span class="tiny">${d.getMonth()+1}/${d.getDate()}</span></th>`).join('')}</tr></thead><tbody>${rows||'<tr><td colspan="8">メンバーがいません</td></tr>'}</tbody></table>`}
function fmtTimes(arr,count){let a=Array.isArray(arr)?arr.slice(0,count):[],missing=Math.max(0,count-a.length);return a.concat(Array(missing).fill('時刻未記録')).join(' / ')||'—'}
function openHistoryDetail(i,key){let m=data[i],dt=gameDateObj(key),r=recForDay(m,key),wk=fmtKey(weekMondayForDate(dt)),w=weekRecForKey(m,wk),weeklyHit=(w.weeklyDates||[]).includes(key);document.getElementById('historyModalTitle').textContent=`${m.name}｜${key}`;let giftOK=giftEligibleOn(m,dt);document.getElementById('historyDetail').innerHTML=r?`<div class="detailrow"><b>デイリー ${r.dailyManual+r.dailySkip}/3</b><br>手動 ${r.dailyManual}回：${fmtTimes(r.dailyManualTimes,r.dailyManual)}<br>スキップ ${r.dailySkip}回：${fmtTimes(r.dailySkipTimes,r.dailySkip)}</div><div class="detailrow"><b>差し入れ</b>：${giftOK?(r.gift?'✓ 済'+(r.giftTime?'（確認 '+r.giftTime+'台）':'（時刻未記録）'):'未確認'):'— 対象外'}</div><div class="detailrow"><b>ウィークリー</b>：${weeklyHit?'この日に参加 ✓':'この日の記録なし'}<br>週合計 ${w.weekly}/7</div>`:`<div class="detailrow">この日の記録はありません。</div>`;document.getElementById('historyModal').classList.add('show')}
function openMemberHistory(i){let m=data[i],keys=new Set(Object.keys(m.days||{}));Object.values(m.weeks||{}).forEach(w=>(w.weeklyDates||[]).forEach(k=>keys.add(k)));let sorted=[...keys].sort().reverse();document.getElementById('historyModalTitle').textContent=`${m.name}｜個人履歴`;document.getElementById('historyDetail').innerHTML=sorted.length?sorted.map(key=>{let r=recForDay(m,key),dt=gameDateObj(key),wk=fmtKey(weekMondayForDate(dt)),w=weekRecForKey(m,wk),wh=(w.weeklyDates||[]).includes(key);return `<div class="detailrow"><b>${key}</b><br>${r?`対 ${r.dailyManual+r.dailySkip}/3（手${r.dailyManual}・ス${r.dailySkip}）　差 ${giftEligibleOn(m,dt)?(r.gift?'✓'+(r.giftTime?' '+r.giftTime+'台':' 時刻未記録'):'×'):'—'}`:'デイリー記録なし'}${wh?'　週✓':''}</div>`}).join(''):'<div class="detailrow">履歴はまだありません。</div>';document.getElementById('historyModal').classList.add('show')}
function closeHistoryDetail(){document.getElementById('historyModal').classList.remove('show')}
function csvEscape(v){let s=String(v??'');return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
function allHistoryKeys(){let set=new Set();data.forEach(m=>{Object.keys(m.days||{}).forEach(k=>set.add(k));Object.values(m.weeks||{}).forEach(w=>(w.weeklyDates||[]).forEach(k=>set.add(k)))});return [...set].sort()}
function exportHistoryCSV(all){let keys;if(all)keys=allHistoryKeys();else{let mon=mondayForOffset(historyWeekOffset);keys=[...Array(7)].map((_,j)=>{let d=new Date(mon);d.setDate(mon.getDate()+j);return fmtKey(d)})}let rows=[['日付','名前','加入日','手動回数','スキップ回数','合計','手動参加時間','スキップ参加時間','差し入れ','差し入れ確認時間','ウィークリー当日参加','週合計']];keys.forEach(key=>{let dt=gameDateObj(key),wk=fmtKey(weekMondayForDate(dt));data.forEach(m=>{let join=m.join?gameDateObj(m.join):null;if(join&&dt<join)return;let r=recForDay(m,key),w=weekRecForKey(m,wk),wh=(w.weeklyDates||[]).includes(key);if(all&&!r&&!wh)return;rows.push([key,m.name,m.join||'',r?r.dailyManual:0,r?r.dailySkip:0,r?r.dailyManual+r.dailySkip:0,r?fmtTimes(r.dailyManualTimes,r.dailyManual):'',r?fmtTimes(r.dailySkipTimes,r.dailySkip):'',giftEligibleOn(m,dt)?(r&&r.gift?'済':'未確認'):'対象外',r&&r.gift?(r.giftTime||'時刻未記録'):'',wh?'参加':'',w.weekly])})});let csv='\ufeff'+rows.map(row=>row.map(csvEscape).join(',')).join('\r\n'),blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=all?`hirosaba-history-all-${dkey()}.csv`:`hirosaba-history-${keys[0]}_${keys[keys.length-1]}.csv`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function render(){let now=new Date(),g=gameNow();document.getElementById('today').textContent=`${new Intl.DateTimeFormat('ja-JP',{dateStyle:'full'}).format(now)} ｜ ゲーム内更新 5:00`;document.getElementById('members').textContent=data.length;let bc=0,gc=0,gEligible=0;data.forEach(m=>{let r=todayRec(m);if((r.dailyManual+r.dailySkip)>=3)bc++;if(giftEligibleToday(m)){gEligible++;if(r.gift)gc++}});document.getElementById('battle').textContent=`${bc}/${data.length}`;document.getElementById('gift').textContent=`${gc}/${gEligible}`;document.getElementById('cards').innerHTML=data.length?data.map((m,i)=>{let r=todayRec(m),w=weekRec(m),eligible=battleEligibleForWeek(m,mondayForOffset(0)),giftOK=giftEligibleToday(m);return `<article class="card"><div class="top"><div><div class="name">${esc(m.name)}</div><div class="joined">加入日：${m.join||'未設定'}</div></div><button class="ghost" onclick="editMember(${i})">編集</button></div><div class="fixed"><div><div class="label">加入後の挨拶</div><button class="toggle ${m.greet?'on':''}" onclick="toggle(${i},'greet')">${m.greet?'✓ 済':'未確認'}</button></div><div><div class="label">運営ルール確認</div><button class="toggle ${m.rules?'on':''}" onclick="toggle(${i},'rules')">${m.rules?'✓ 確認済':'未確認'}</button></div></div><div class="sectionline"></div><div class="daily-title">対抗戦</div><div class="battlegrid"><div><div class="label">デイリー参加（合計3回まで）</div>${eligible?`<div class="counter"><button onclick="changeDailyType(${i},'manual',-1)">−</button><div class="count ${r.dailyManual+r.dailySkip>=3?'done':''}">手動 ${r.dailyManual}</div><button onclick="changeDailyType(${i},'manual',1)">＋</button></div><div class="counter" style="margin-top:6px"><button onclick="changeDailyType(${i},'skip',-1)">−</button><div class="count ${r.dailyManual+r.dailySkip>=3?'done':''}">スキップ ${r.dailySkip}</div><button onclick="changeDailyType(${i},'skip',1)">＋</button></div><div class="hint">参加時間 <select id="dailyHour-${i}" style="margin:4px 0;padding:5px;border:1px solid #cbd5e1;border-radius:8px">${hourOptions(currentHourKey())}</select></div><div class="hint">手動：${timeSummary(r,'manual')}<br>スキップ：${timeSummary(r,'skip')}<br>合計 ${r.dailyManual+r.dailySkip}/3 ｜ 毎日 AM5:00 切り替え</div>`:`<div class="count" style="background:#f1f5f9;color:#94a3b8">—</div>`}</div><div><div class="label">ウィークリー参加</div>${eligible?`<div class="counter"><button onclick="changeWeekly(${i},-1)">−</button><div class="count ${w.weekly>=7?'done':''}">${w.weekly}/7</div><button onclick="changeWeekly(${i},1)">＋</button></div>`:`<div class="count" style="background:#f1f5f9;color:#94a3b8">—</div>`}<div class="hint">参加日：${weeklyDateSummary(w)}<br>毎週月曜 AM5:00 切り替え</div></div></div><div class="daily"><div><div class="label">差し入れ</div>${giftOK?`<button class="toggle ${r.gift?'on':''}" onclick="toggleGift(${i})">${r.gift?'✓ 済':'未確認'}</button><div class="hint">${r.gift?'確認時間：'+(r.giftTime?r.giftTime+'～'+String((Number(r.giftTime.slice(0,2))+1)%24).padStart(2,'0')+':59':'時刻未記録'):'確認時間：—'}</div>`:`<div class="count" style="background:#f1f5f9;color:#94a3b8">—</div>`}<div class="hint">毎日 AM5:00 切り替え</div></div></div></article>`}).join(''):'<div class="empty">まだメンバーがいません。<br>「＋ メンバー」から追加してください。</div>';localStorage.setItem(KEY,JSON.stringify(data));if(document.getElementById('weekPanel').classList.contains('active'))renderWeek();if(document.getElementById('historyPanel').classList.contains('active'))renderHistory()}
function toggle(i,k){data[i][k]=!data[i][k];persist()} function toggleGift(i){let r=todayRec(data[i]);if(r.gift){r.gift=false;r.giftTime=''}else{r.gift=true;r.giftTime=currentHourKey()}persist()}
function changeDailyType(i,type,n){let r=todayRec(data[i]);let key=type==='skip'?'dailySkip':'dailyManual',times=type==='skip'?r.dailySkipTimes:r.dailyManualTimes;if(n>0){if(r.dailyManual+r.dailySkip>=3)return;let sel=document.getElementById('dailyHour-'+i);times.push(sel?sel.value:currentHourKey());r[key]++}else{if(r[key]<=0)return;r[key]--;if(times.length>r[key])times.pop()}persist()} function changeWeekly(i,n){let r=weekRec(data[i]);if(n>0){if(r.weekly>=7)return;r.weekly++;r.weeklyDates.push(dkey())}else{if(r.weekly<=0)return;r.weekly--;if(r.weeklyDates.length>r.weekly)r.weeklyDates.pop()}persist()}
let deleteArmed=false;
function resetDeleteButton(){deleteArmed=false;const b=document.getElementById('deleteBtn');b.textContent='メンバー削除';b.style.background='white';b.style.color='#b91c1c'}
function openAdd(){editing=null;resetDeleteButton();document.getElementById('modalTitle').textContent='メンバー追加';document.getElementById('name').value='';document.getElementById('join').value=new Date().toLocaleDateString('sv-SE');document.getElementById('deleteBtn').style.display='none';document.getElementById('modal').classList.add('show')} function editMember(i){editing=i;resetDeleteButton();document.getElementById('modalTitle').textContent='メンバー編集';document.getElementById('name').value=data[i].name;document.getElementById('join').value=data[i].join||'';document.getElementById('deleteBtn').style.display='inline-block';document.getElementById('modal').classList.add('show')} function closeModal(){resetDeleteButton();document.getElementById('modal').classList.remove('show')}
function deleteMember(){if(editing===null||!data[editing])return;const b=document.getElementById('deleteBtn');if(!deleteArmed){deleteArmed=true;b.textContent='もう一度押して削除';b.style.background='#fee2e2';b.style.color='#991b1b';return}data.splice(editing,1);editing=null;deleteArmed=false;document.getElementById('modal').classList.remove('show');persist()}
function saveMember(){const nameInput=document.getElementById('name'),joinInput=document.getElementById('join');const memberName=nameInput.value.trim();if(!memberName)return alert('名前を入力してください');if(editing===null)data.push({name:memberName,join:joinInput.value,greet:false,rules:false,days:{},weeks:{}});else{data[editing].name=memberName;data[editing].join=joinInput.value}closeModal();persist()}
function resetToday(){if(!confirm('現在のゲーム内デイリー（手動・スキップ・差し入れ）を未確認に戻しますか？'))return;data.forEach(m=>m.days[dkey()]={dailyManual:0,dailySkip:0,gift:false,dailyManualTimes:[],dailySkipTimes:[],giftTime:''});persist()}

document.getElementById('modal').addEventListener('click',e=>{if(e.target===document.getElementById('modal'))closeModal()});document.getElementById('historyModal').addEventListener('click',e=>{if(e.target===document.getElementById('historyModal'))closeHistoryDetail()});render();

function exportBackup(){
 const payload={app:'hirosaba-office-manager',version:1,exportedAt:new Date().toISOString(),data};
 const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
 const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`hirosaba-backup-${dkey()}.json`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function importBackupFile(file){
 if(!file)return; const reader=new FileReader(); reader.onload=()=>{try{const obj=JSON.parse(reader.result); const next=Array.isArray(obj)?obj:obj.data; if(!Array.isArray(next))throw new Error(); if(!confirm('現在のデータをバックアップ内容で置き換えますか？'))return; data=next; persist(); alert('バックアップを復元しました');}catch(e){alert('このバックアップファイルを読み込めませんでした');}}; reader.readAsText(file);
}

function openBulk(){
 const rows=document.getElementById('bulkRows');
 rows.innerHTML=Array.from({length:15},(_,i)=>`<div class="bulkrow" data-row="${i}"><input class="wide bn" type="text" placeholder="名前"><input class="wide bj" type="date"><label><input class="bg" type="checkbox">挨拶済</label><label><input class="br" type="checkbox">ルール済</label><label>手動 <input class="bm" type="number" min="0" max="3" value="0"></label><label>スキップ <input class="bs" type="number" min="0" max="3" value="0"></label><label>差 <input class="bf" type="checkbox"> / 週 <input class="bw" type="number" min="0" max="7" value="0"></label></div>`).join('');
 document.getElementById('bulkModal').classList.add('show');
}
function closeBulk(){document.getElementById('bulkModal').classList.remove('show')}
function saveBulk(){
 const rows=[...document.querySelectorAll('#bulkRows .bulkrow')]; let added=0;
 for(const row of rows){
  const name=row.querySelector('.bn').value.trim(); if(!name)continue;
  let manual=Math.max(0,Math.min(3,Number(row.querySelector('.bm').value)||0));
  let skip=Math.max(0,Math.min(3-manual,Number(row.querySelector('.bs').value)||0));
  let weekly=Math.max(0,Math.min(7,Number(row.querySelector('.bw').value)||0));
  const m={name,join:row.querySelector('.bj').value,greet:row.querySelector('.bg').checked,rules:row.querySelector('.br').checked,days:{},weeks:{}};
  m.days[dkey()]={dailyManual:manual,dailySkip:skip,gift:row.querySelector('.bf').checked};
  m.weeks[wkey()]={weekly}; data.push(m); added++;
 }
 if(!added)return alert('名前が入力されたメンバーがいません');
 closeBulk(); persist(); alert(`${added}人を登録しました`);
}
document.getElementById('bulkModal').addEventListener('click',e=>{if(e.target===document.getElementById('bulkModal'))closeBulk()});

document.getElementById('backupFile').addEventListener('change',e=>{importBackupFile(e.target.files[0]);e.target.value=''});
